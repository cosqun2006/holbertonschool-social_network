<!DOCTYPE html>
<html>
    <body>
        <form action="/" method="POST">
            <input type="text" placeholder="Your Name" name="name">
            <input type="text" placeholder="Post content" name="post">
            <input type="submit" value="Share">
        </form>
        {% for post in posts %}
            <div>{{ post[1] + ": " + post[2] }}</div>
        {% endfor %}
    </body>
</html>
